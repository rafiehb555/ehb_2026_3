name: EHB · Auto Deploy + Smoke Test

on:
  push:
    branches: [EHB-PVT-LTD-4, main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Smoke test (no deps required)
        run: node scripts/smoke-test-e2e.mjs

      - name: Lint
        run: pnpm lint || true
        continue-on-error: true

      - name: Duplication scan
        run: node scripts/check-duplication.mjs || true
        continue-on-error: true

  notify:
    needs: smoke-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Push status
        run: |
          if [ "${{ needs.smoke-test.result }}" = "success" ]; then
            echo "✅ EHB build healthy"
          else
            echo "❌ EHB build broken — investigate"
            exit 1
          fi
