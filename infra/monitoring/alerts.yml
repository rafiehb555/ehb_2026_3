# EHB · Prometheus alerting rules

groups:
  - name: ehb_api_critical
    interval: 30s
    rules:
      - alert: APIHighErrorRate
        expr: rate(http_requests_total{service="api", status=~"5.."}[5m]) / rate(http_requests_total{service="api"}[5m]) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "API 5xx > 1% for 5 min"
          runbook: "ehb-info/12-operations/RUNBOOKS.md#1-api-5xx-surge"

      - alert: APIDown
        expr: up{service="api"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "EHB API service down"

      - alert: PaymentFailureSpike
        expr: rate(ehb_payment_failures_total[5m]) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Payment failures > 5% for 5 min"

  - name: ehb_trust
    interval: 1m
    rules:
      - alert: STLDriftDetected
        expr: ehb_stl_formula_version_mismatch > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "STL formula version mismatch — investigate immediately"

      - alert: HighComplaintRate
        expr: rate(ehb_complaints_filed_total[1h]) > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Complaint rate > 100/hour — check for systemic issue"

      - alert: AnchorFailureSpike
        expr: rate(ehb_polkadot_anchor_failures_total[10m]) / rate(ehb_polkadot_anchor_total[10m]) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Polkadot anchor failure rate > 5%"
          runbook: "ehb-info/12-operations/RUNBOOKS.md#4-polkadot-anchor-failure"

  - name: ehb_ai
    interval: 1m
    rules:
      - alert: AIServiceRateLimit
        expr: rate(ehb_ai_429_responses_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI provider returning 429 — drop to cheaper model"

      - alert: AICostBudgetExceeded
        expr: ehb_ai_daily_cost_usd > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI daily cost exceeded $200 budget"

  - name: ehb_infra
    interval: 1m
    rules:
      - alert: DiskNearFull
        expr: node_filesystem_free_bytes / node_filesystem_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk > 90% full"

      - alert: MongoConnectionPoolExhausted
        expr: mongodb_connections_current / mongodb_connections_available > 0.9
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Mongo connection pool > 90% used"
